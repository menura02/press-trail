name: haber-iz-surucusu
x-backend: &backend
  build: ./backend
  environment:
    DATABASE_URL: postgresql+psycopg://haber:${POSTGRES_PASSWORD:-haber-yerel-gelistirme}@postgres:5432/haber
    MATCH_WINDOW_HOURS: ${MATCH_WINDOW_HOURS:-72}
  restart: unless-stopped
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: haber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haber-yerel-gelistirme}
      POSTGRES_DB: haber
    volumes:
      - haber-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haber -d haber"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.api:app --host 0.0.0.0 --port 8000 --no-access-log"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  haber-db:

